[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "text-to-world-3d-scene-generator"
version = "0.6.2"
description = "Desktop tool that turns a text prompt into an explorable 3D scene."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "text-to-world contributors" }]
keywords = ["3d", "scene-generation", "text-to-3d", "gaussian-splatting", "gltf"]

dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "pydantic>=2.6,<3",
    "PySide6>=6.7",
    "trimesh>=4.4",
    "pygltflib>=1.16",
    "httpx>=0.27",
    "rich>=13.7",
    "platformdirs>=4.2",
    "watchdog>=4.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.4",
    "torchvision>=0.19",
    "diffusers>=0.30",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
text-to-world = "text_to_world.__main__:main"

[project.gui-scripts]
text-to-world-gui = "text_to_world.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/text_to_world"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"